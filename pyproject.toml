[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-workflow-engine"
version = "1.0.0"
description = "Deterministic governance gates for AI-assisted software development"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
# Serving stack for the local AgentOS Dashboard (`agentos_dashboard/`), selected by the Human
# Owner in OD-D9 (`docs/agentos-dashboard/OPEN_QUESTIONS.md`; `DECISIONS.md` DD-09). Deliberately
# optional: a default `pip install ai-workflow-engine` installs no HTTP-serving dependency, so the
# audited engine package and its `workflowctl` CLI stay free of a web surface. DASH-004 and later
# dashboard stages may use only what is declared here unless separately authorized.
dashboard = [
  "fastapi>=0.111,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.30,<1",
]
dev = [
  "black>=24.4,<26",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
workflowctl = "ai_workflow_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_workflow_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Frozen historical orchestration artifacts. The Python files under these directories are
# evidence: verbatim probe scripts recorded during ORCH-00x execution and review. They are
# records of what was run, not maintained source, so they must stay byte-identical and are
# excluded from every formatter and linter. `force-exclude`/`extend-exclude` are required
# because pre-commit passes file paths explicitly rather than letting the tools walk the tree.
[tool.black]
line-length = 100
target-version = ["py311"]
force-exclude = '''
/docs/implementation/orchestration/(evidence|reviews|handoffs)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
force-exclude = true
extend-exclude = [
  "docs/implementation/orchestration/evidence/**",
  "docs/implementation/orchestration/reviews/**",
  "docs/implementation/orchestration/handoffs/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ai_workflow_engine"]
