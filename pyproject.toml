[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-workflow-engine"
version = "1.0.0"
description = "Deterministic governance gates for AI-assisted software development"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
# Serving stack for the local AgentOS Dashboard (`agentos_dashboard/`), selected by the Human
# Owner in OD-D9 (`docs/agentos-dashboard/OPEN_QUESTIONS.md`; `DECISIONS.md` DD-09). Deliberately
# optional: a default `pip install ai-workflow-engine` installs no HTTP-serving dependency, so the
# audited engine package and its `workflowctl` CLI stay free of a web surface. DASH-004 and later
# dashboard stages may use only what is declared here unless separately authorized.
dashboard = [
  "fastapi>=0.111,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.30,<1",
]
dev = [
  "black>=24.4,<26",
  # AUTO-016: the Section 25 packaging tests build a real wheel with `pip wheel
  # --no-build-isolation`, which requires the `[build-system]` backend to be importable from the
  # interpreter running the build rather than from a throwaway isolated environment. Without this
  # entry the backend was present only where a developer happened to have it installed globally,
  # so those tests passed locally and failed in CI with `Cannot import 'hatchling.build'`. Pinned
  # to the same floor as `[build-system] requires` so the two can never disagree.
  "hatchling>=1.25",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
workflowctl = "ai_workflow_engine.cli:main"

[tool.hatch.build.targets.wheel]
# AUTO-008: `agentos_workflow` and `agentos_dashboard` were absent here, so neither was installed
# by `pip install -e .` and neither was importable from outside the repository root. The workflow
# engine in particular is a program, not a checkout-only script collection, so it must ship.
packages = [
  "src/ai_workflow_engine",
  "agentos_workflow",
  "agentos_dashboard",
]

[tool.pytest.ini_options]
# AUTO-008: previously `["tests"]` alone, which silently excluded 1,803 of the repository's 2,963
# tests -- every `agentos_workflow` and `agentos_dashboard` test -- from `pytest` and therefore
# from CI. The newest and largest subsystem was the least verified. All three suites now run by
# default; a suite that is not collected is not a safety net.
testpaths = ["tests", "agentos_workflow/tests", "agentos_dashboard/tests"]
# AUTO-010: `-m "not live_cli"` excludes the opt-in live provider acceptance tests from the
# default run. They spawn the real Claude and Codex CLIs, which costs money, needs credentials
# this repository does not hold or manage, and reaches the network -- none of which belongs in
# a default `pytest` or in ordinary CI. `pytest -m live_cli` selects exactly them, because a
# command-line `-m` replaces the one configured here rather than adding to it.
#
# The marker earns its keep only if the exclusion is honest: a mocked test is never presented as
# evidence that a real CLI works. That distinction is the whole reason these two sets are separate.
addopts = "-ra -m 'not live_cli'"
markers = [
  "live_cli: spawns a real installed provider CLI; opt-in, excluded from the default run",
]

# Frozen historical orchestration artifacts. The Python files under these directories are
# evidence: verbatim probe scripts recorded during ORCH-00x execution and review. They are
# records of what was run, not maintained source, so they must stay byte-identical and are
# excluded from every formatter and linter. `force-exclude`/`extend-exclude` are required
# because pre-commit passes file paths explicitly rather than letting the tools walk the tree.
[tool.black]
line-length = 100
target-version = ["py311"]
force-exclude = '''
/docs/implementation/orchestration/(evidence|reviews|handoffs)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
force-exclude = true
extend-exclude = [
  "docs/implementation/orchestration/evidence/**",
  "docs/implementation/orchestration/reviews/**",
  "docs/implementation/orchestration/handoffs/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
# AUTO-008: `agentos_workflow` and `agentos_dashboard` were never type-checked. Both are added
# under the same `strict = true` setting the legacy engine already meets -- a weaker per-package
# override would make the shared setting misleading about what has actually been verified.
#
# `files` rather than `packages`: `packages` resolves names through the *installed* distribution
# and refuses a package with no `py.typed` marker, whereas these are checked as source trees --
# exactly what the previous `mypy src` invocation did. Listing them here instead of on the command
# line is what lets CI and pre-commit both run a bare `mypy` and check the identical set.
files = [
  "src/ai_workflow_engine",
  "agentos_workflow",
  "agentos_dashboard",
]
# Test suites stay out of scope, matching the pre-existing standard: `mypy src` never checked the
# top-level `tests/` tree either. Bringing ~2,000 tests under `strict` is a deliberate, separate
# decision, not a side effect of putting production code under the type checker.
exclude = "^(agentos_workflow|agentos_dashboard)/tests/"
