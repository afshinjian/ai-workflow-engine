# candidates originally compared in the historical decision-support document
# docs/workflow-automation/successor-planning/AUTO-015-CANDIDATES.md. That document remains the
# historical, narrative-prose decision-support record consulted by GOV-AUTO-08; it is NOT itself
# the runtime authoritative catalog AUTO-015 would read, because its ~21-field narrative schema
# does not conform to §10.1's typed, versioned, hashed schema (no candidate_id grammar, no
# schema_version, no content_hash, no typed dependencies/blockers/evidence_references lists).
# This file is that missing typed conversion, produced as a correction identified by the final
# independent AUTO-015 contract review. It does not select, authorize, register, or implement
# anything. It is not itself an authoritative source until a future, separately authorized
# AUTO-015 implementation reads it under DEC-003's static-catalog policy.
#
# IMPORTANT -- lifecycle_status is deliberately ABSENT from every candidate entry below.
# AUTO-015.md §10.1 defines lifecycle_status as "computed by §11, never author-set"; a static
# catalog file that assigned it a literal value (eligible/blocked/deferred/insufficient_evidence)
# would misrepresent a computed field as authored data, and the enum's own "unknown" member is
# reserved to signal a load-time validation failure (§16.4), not a placeholder. A future
# eligibility engine computes this field live from Task Queue / Registry / OPEN_QUESTIONS.md at
# read time; it is never read from this file.
#
# blockers[].live_status below reflects each blocker's status as independently verified against
# docs/workflow-automation/OPEN_QUESTIONS.md at the time this catalog was authored (all of
# OD-6/7/10/11/12 confirmed Open; D-14/15/16 are AUTO-013's deferred findings). Per AUTO-015.md
# §10.1, this frozen text is illustrative only and must be re-resolved live at read time by any
# future implementation -- it is never trusted from this file's own text.
#
# content_hash is computed exactly per AUTO-015.md §10.1/§16.2's canonical hashing rule: SHA-256
# over this candidate's own canonical fields (candidate_id, schema_version, title, mission,
# source_kind, source_reference, mvp_relation, dependencies, blockers, required_owner_decisions,
# allowed_recommendation_status, evidence_references -- excluding lifecycle_status and
# content_hash itself), serialized with the existing production primitive
# src/ai_workflow_engine/prompt/renderer.py:canonical_json (NFC, sorted keys, compact separators,
# no floats). These are REAL, verifiable digests, not placeholders: recomputing canonical_json()
# over the same field set reproduces the same value byte-for-byte.

